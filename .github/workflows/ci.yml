name: CI

on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mistralai-agents
      - run: python -m compileall -q gameforge main.py scripts
      - run: python scripts/smoke.py
